<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>JitterDev — Status console</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { color-scheme: dark; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 20px 72px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f4f1ff;
      background: radial-gradient(ellipse at 20% 6%, rgba(112, 66, 156, 0.35), transparent 46%),
                  radial-gradient(ellipse at 84% 90%, rgba(71, 46, 132, 0.34), transparent 46%), #0c0917;
    }

    .panel {
      width: 100%;
      max-width: 460px;
      padding: 34px 28px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(125, 100, 160, 0.18), rgba(30, 22, 45, 0.5));
      border: 1px solid rgba(222, 200, 255, 0.2);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.16), 0 24px 70px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(24px) saturate(150%);
    }

    h1 { font-size: 1.4rem; letter-spacing: -0.02em; }
    .sub { margin-top: 8px; color: #a1a1aa; font-size: 0.85rem; line-height: 1.6; }

    label.field { display: block; margin-top: 26px; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #8d80a6; }
    input[type="password"] {
      width: 100%;
      margin-top: 8px;
      padding: 12px 14px;
      font: inherit;
      font-size: 0.9rem;
      color: #f4f1ff;
      background: rgba(15, 11, 24, 0.65);
      border: 1px solid rgba(217, 193, 255, 0.28);
      border-radius: 11px;
      outline: none;
    }
    input[type="password"]:focus-visible { border-color: #c4b5fd; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25); }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 22px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(23, 17, 35, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .switch-row .label { font-size: 0.9rem; font-weight: 650; }
    .switch-row .state { display: block; margin-top: 3px; font-size: 0.72rem; color: #8d80a6; }

    .switch {
      position: relative;
      flex-shrink: 0;
      width: 58px;
      height: 32px;
      padding: 0;
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid rgba(217, 193, 255, 0.3);
      background: linear-gradient(145deg, rgba(167, 135, 214, 0.22), rgba(62, 42, 91, 0.4));
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.16);
      transition: background 0.25s ease, border-color 0.25s ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e4dcf5;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s cubic-bezier(.2, .8, .2, 1), background 0.25s ease;
    }
    .switch[aria-checked="true"] {
      background: linear-gradient(145deg, rgba(180, 143, 255, 0.9), rgba(100, 55, 180, 0.9));
      border-color: rgba(231, 215, 255, 0.55);
    }
    .switch[aria-checked="true"]::after { transform: translateX(26px); background: #fff; }
    .switch[disabled] { opacity: 0.5; cursor: not-allowed; }
    .switch:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 3px; }

    #message { margin-top: 18px; min-height: 1.2em; font-size: 0.82rem; line-height: 1.5; color: #a1a1aa; }
    #message[data-tone="error"] { color: #fca5a5; }
    #message[data-tone="ok"] { color: #c4b5fd; }
    .foot { margin-top: 24px; font-size: 0.7rem; color: #5f5872; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Status console</h1>
    <p class="sub">Turn the public maintenance overlay on or off. The change is saved to the repository, so every visitor sees it.</p>

    <label class="field" for="passcode">Admin passcode</label>
    <input id="passcode" type="password" autocomplete="current-password" placeholder="••••••••" />

    <div class="switch-row">
      <span class="label">
        Maintenance overlay
        <span class="state" id="state-label">Loading…</span>
      </span>
      <button id="toggle" class="switch" role="switch" aria-checked="false" aria-label="Maintenance overlay" disabled></button>
    </div>

    <p id="message" role="status"></p>

    <p class="foot">Needs the <code>GITHUB_TOKEN</code> and <code>ADMIN_PASSCODE</code> environment variables in the hosting project.</p>
  </main>

  <script>
    (function () {
      const passcode = document.getElementById("passcode");
      const toggle = document.getElementById("toggle");
      const stateLabel = document.getElementById("state-label");
      const message = document.getElementById("message");

      passcode.value = sessionStorage.getItem("jitterAdminPasscode") || "";

      function say(text, tone) {
        message.textContent = text;
        message.dataset.tone = tone || "";
      }

      const NOT_CONNECTED = "The status API is not reachable here. Set GITHUB_TOKEN and ADMIN_PASSCODE in the hosting project, redeploy, then reload.";

      async function readJson(response) {
        try { return JSON.parse(await response.text()); } catch (error) { return null; }
      }

      function paint(enabled) {
        toggle.setAttribute("aria-checked", String(enabled));
        stateLabel.textContent = enabled ? "On — visitors see the notice" : "Off — site is visible";
        toggle.disabled = false;
      }

      async function load() {
        try {
          const response = await fetch("/api/maintenance?t=" + Date.now(), { cache: "no-store" });
          const state = await readJson(response);
          if (!response.ok || !state) throw new Error((state && state.error) || NOT_CONNECTED);
          paint(Boolean(state.enabled));
          say("Current state loaded.", "ok");
        } catch (error) {
          toggle.disabled = true;
          stateLabel.textContent = "Unknown";
          say(error.message, "error");
        }
      }

      async function save(enabled) {
        const code = passcode.value.trim();
        if (!code) {
          say("Enter the admin passcode first.", "error");
          paint(!enabled);
          return;
        }
        sessionStorage.setItem("jitterAdminPasscode", code);
        toggle.disabled = true;
        say("Saving…");
        try {
          const response = await fetch("/api/maintenance", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-admin-passcode": code },
            body: JSON.stringify({ enabled }),
          });
          const state = await readJson(response);
          if (!response.ok || !state) throw new Error((state && state.error) || NOT_CONNECTED);
          paint(Boolean(state.enabled));
          say(state.enabled ? "Overlay is on. Visitors now see the maintenance card." : "Overlay is off. The site is visible again.", "ok");
        } catch (error) {
          paint(!enabled);
          say(error.message, "error");
        }
      }

      toggle.addEventListener("click", () => {
        save(toggle.getAttribute("aria-checked") !== "true");
      });

      load();
    })();
  </script>
</body>
</html>
