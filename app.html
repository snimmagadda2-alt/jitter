<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JitterDev Editor</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #090712; color: #ffffff; height: 100vh; display: flex; flex-direction: column; }
    header { background: #120e24; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(139, 92, 246, 0.25); }
    .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 28px; height: 28px; border-radius: 7px; }
    .brand { font-weight: 800; font-size: 1.2rem; color: #ffffff; letter-spacing: -0.5px; }
    .brand span { color: #8b5cf6; }
    .status { font-size: 0.85rem; color: #a78bfa; margin-left: 14px; background: rgba(139, 92, 246, 0.15); padding: 4px 10px; border-radius: 6px; }
    .controls button { background: #1e183b; color: #ddd6fe; border: 1px solid rgba(139, 92, 246, 0.3); padding: 8px 14px; border-radius: 8px; cursor: pointer; margin-left: 8px; font-weight: 600; transition: background 0.15s; }
    .controls button:hover { background: #2e2459; color: #fff; }
    .controls button.primary { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; border: none; }
    .controls button.primary:hover { opacity: 0.92; }
    #editor-container { flex: 1; position: relative; overflow: hidden; }
    #code { width: 100%; height: 100%; background: #0d0a1a; color: #f8f8f2; border: none; padding: 18px; font-family: monospace; font-size: 15px; resize: none; outline: none; }
    .CodeMirror { height: 100%; font-size: 15px; background: #0d0a1a !important; }
    .CodeMirror-gutters { background: #120e24 !important; border-right: 1px solid rgba(139, 92, 246, 0.15) !important; }
    /* Language Modal */
    #lang-modal { position: fixed; inset: 0; background: rgba(5, 4, 12, 0.85); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .modal-box { background: #120e24; padding: 30px; border-radius: 16px; width: 90%; max-width: 410px; text-align: center; border: 1px solid rgba(139, 92, 246, 0.4); box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6); }
    .modal-box h2 { margin-bottom: 8px; color: #ffffff; font-size: 1.4rem; }
    .modal-box p { margin-bottom: 20px; color: #c4b5fd; font-size: 0.92rem; }
    .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .lang-btn { background: #1e183b; color: #fff; border: 1px solid rgba(139, 92, 246, 0.3); padding: 13px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.15s; }
    .lang-btn:hover { background: #8b5cf6; border-color: #a78bfa; transform: translateY(-1px); }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <img src="icon.png" alt="Logo" class="brand-icon">
      <span class="brand">Jitter<span>Dev</span></span>
      <span class="status" id="file-info">Untitled • No Language Selected</span>
    </div>
    <div class="controls">
      <button type="button" onclick="openFile()">Open File</button>
      <button type="button" onclick="saveFile()" class="primary">Save File</button>
      <button type="button" onclick="showModal()">Change Language</button>
    </div>
  </header>

  <div id="editor-container">
    <textarea id="code" placeholder="Start typing your code here..."></textarea>
  </div>

  <!-- Language Selection Popup -->
  <div id="lang-modal">
    <div class="modal-box">
      <h2>Which coding language?</h2>
      <p>Choose the language for this file to enable syntax highlighting.</p>
      <div class="lang-grid">
        <button type="button" class="lang-btn" data-lang="HTML" data-mode="htmlmixed">HTML</button>
        <button type="button" class="lang-btn" data-lang="CSS" data-mode="css">CSS</button>
        <button type="button" class="lang-btn" data-lang="JavaScript" data-mode="javascript">JavaScript</button>
        <button type="button" class="lang-btn" data-lang="C#" data-mode="text/x-csharp">C#</button>
        <button type="button" class="lang-btn" data-lang="C++" data-mode="text/x-c++src">C++</button>
        <button type="button" class="lang-btn" data-lang="C" data-mode="text/x-csrc">C</button>
      </div>
    </div>
  </div>

  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>

  <script>
    let fileHandle = null;
    let currentFileName = "Untitled";
    let currentLang = "Plain Text";
    let editor = null;
    const textarea = document.getElementById("code");
    const modal = document.getElementById("lang-modal");

    if (typeof CodeMirror !== "undefined") {
      editor = CodeMirror.fromTextArea(textarea, {
        lineNumbers: true,
        theme: "dracula",
        tabSize: 2
      });
    }

    function showModal() {
      modal.style.display = "flex";
    }

    function updateStatus() {
      document.getElementById("file-info").textContent = `${currentFileName} • ${currentLang}`;
    }

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentLang = btn.getAttribute("data-lang");
        const mode = btn.getAttribute("data-mode");
        modal.style.display = "none";
        updateStatus();

        if (editor) {
          editor.setOption("mode", mode);
          editor.focus();
        } else {
          textarea.focus();
        }
      });
    });

    async function openFile() {
      try {
        [fileHandle] = await window.showOpenFilePicker();
        const file = await fileHandle.getFile();
        const contents = await file.text();
        currentFileName = file.name;

        if (editor) {
          editor.setValue(contents);
        } else {
          textarea.value = contents;
        }
        showModal();
      } catch (err) {
        console.log("Open cancelled:", err);
      }
    }

    async function saveFile() {
      try {
        const textToSave = editor ? editor.getValue() : textarea.value;
        if (!fileHandle) {
          fileHandle = await window.showSaveFilePicker({ suggestedName: currentFileName });
          currentFileName = fileHandle.name;
        }
        const writable = await fileHandle.createWritable();
        await writable.write(textToSave);
        await writable.close();
        updateStatus();
      } catch (err) {
        console.log("Save cancelled:", err);
      }
    }
  </script>
</body>
</html>
