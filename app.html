  <header>

  <div id="editor-container">

  <!-- Hidden fallback input for Firefox / Safari -->

  <script>
    let fileHandle = null;
    let currentFileName = "untitled";
    let currentLang = "Plain Text";

    const textarea = document.getElementById("code");
    const modal = document.getElementById("lang-modal");
    const fileInfo = document.getElementById("file-info");
    const fallbackOpen = document.getElementById("fallback-open");

    // Language-specific snippets & keywords for Tab expansion
    const languageSnippets = {
      "HTML": {
        "!": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Document</title>\n</head>\n<body>\n  \n</body>\n</html>"
      },
      "JavaScript": {
        "clg": "console.log();",
        "fn": "function name(params) {\n  \n}",
        "afn": "const name = (params) => {\n  \n};",
        "fori": "for (let i = 0; i < array.length; i++) {\n  \n}"
      },
      "C#": {
        "cw": "Console.WriteLine();",
        "main": "using System;\n\nclass Program {\n  static void Main() {\n    Console.WriteLine(\"Hello World\");\n  }\n}"
      },
      "C++": {
        "main": "#include <iostream>\nusing namespace std;\n\nint main() {\n  cout << \"Hello World\" << endl;\n  return 0;\n}",
        "cout": "std::cout <<  << std::endl;"
      },
      "C": {
        "main": "#include <stdio.h>\n\nint main() {\n  printf(\"Hello World\\n\");\n  return 0;\n}",
        "pf": "printf(\"\\n\");"
      },
      "CSS": {
        "flex": "display: flex;\njustify-content: center;\nalign-items: center;",
        "grid": "display: grid;\ngrid-template-columns: repeat(2, 1fr);\ngap: 16px;"
      }
    };

    const editor = CodeMirror.fromTextArea(textarea, {
      theme: "dracula",
      lineNumbers: true,
      tabSize: 2,
      indentUnit: 2,
      indentWithTabs: false,
      autoCloseBrackets: true,
      autoCloseTags: true,
      completeSingle: false,
      extraKeys: {
        "Ctrl-Space": "autocomplete",
        "Ctrl-S": function () { saveFile(); },
        "Cmd-S": function () { saveFile(); },
        "Ctrl-O": function () { openFile(); },
        Cmd-O": function () { openFile(); },
"Tab": function (cm) {
// 1. Accept active autocomplete suggestion
if (cm.state.completionActive && cm.state.completionActive.widget) {
cm.state.completionActive.widget.pick();
return;
}
// 2. Indent if text is selected
if (cm.somethingSelected()) {
cm.indentSelection("add");
return;
}
// 3. Check custom VS Code-style snippets before cursor
const cursor = cm.getCursor();
const line = cm.getLine(cursor.line);
const before = line.slice(0, cursor.ch);
const match = before.match(/(\S+)$/);
if (match && languageSnippets[currentLang] && languageSnippets[currentLang][match[1]]) {
const trigger = match[1];
const expansion = languageSnippets[currentLang][trigger];
cm.replaceRange(
expansion,
{ line: cursor.line, ch: cursor.ch - trigger.length },
cursor
);
return;
}
// 4. Trigger Emmet in HTML/CSS if available
if ((currentLang === "HTML" || currentLang === "CSS") && typeof emmetCodeMirror !== "undefined") {
try {
if (cm.execCommand("emmetExpandAbbreviation") !== false) return;
} catch (e) {}
}
// 5. Fallback: insert 2 spaces
cm.replaceSelection("  ", "end");
},
"Shift-Tab": "indentLess"
}
});
// Enable Emmet if loaded
if (typeof emmetCodeMirror !== "undefined") {
try { emmetCodeMirror(editor); } catch (e) {}
}
// Trigger VS Code-style autocomplete popup while typing
editor.on("inputRead", function (cm, change) {
if (change.origin !== "+input") return;
const ch = change.text[0];
if (!ch || !/[a-zA-Z0-9_.-]/.test(ch)) return;
if (cm.state.completionActive) return;
cm.showHint({
completeSingle: false,
hint: CodeMirror.hint.auto || CodeMirror.hint.anyword
});
});
function updateStatus() {
fileInfo.textContent = ${currentFileName} • ${currentLang};
}
function showModal() {
modal.classList.remove("hidden");
}
function hideModal() {
modal.classList.add("hidden");
editor.focus();
}
// Language Selection Modal Buttons
document.querySelectorAll(".lang-btn").forEach((btn) => {
btn.addEventListener("click", () => {
currentLang = btn.dataset.lang;
const mode = btn.dataset.mode;
editor.setOption("mode", mode);
updateStatus();
hideModal();
});
});
// Close modal when clicking outside the dialog box
modal.addEventListener("click", (e) => {
if (e.target === modal) hideModal();
});
// Detect language from opened file extension
function detectLanguage(filename) {
const ext = filename.split(".").pop().toLowerCase();
const map = {
html: { lang: "HTML", mode: "htmlmixed" },
htm: { lang: "HTML", mode: "htmlmixed" },
css: { lang: "CSS", mode: "css" },
js: { lang: "JavaScript", mode: "javascript" },
cs: { lang: "C#", mode: "text/x-csharp" },
cpp: { lang: "C++", mode: "text/x-c++src" },
cc: { lang: "C++", mode: "text/x-c++src" },
c: { lang: "C", mode: "text/x-csrc" }
};
if (map[ext]) {
currentLang = map[ext].lang;
editor.setOption("mode", map[ext].mode);
}
}
// Open File Button
async function openFile() {
if (window.showOpenFilePicker) {
try {
const [handle] = await window.showOpenFilePicker();
fileHandle = handle;
const file = await handle.getFile();
const text = await file.text();
currentFileName = file.name;
editor.setValue(text);
detectLanguage(currentFileName);
updateStatus();
hideModal();
} catch (err) {
if (err.name !== "AbortError") console.error(err);
}
} else {
fallbackOpen.click();
}
}
fallbackOpen.addEventListener("change", (e) => {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = (ev) => {
fileHandle = null;
currentFileName = file.name;
editor.setValue(ev.target.result);
detectLanguage(currentFileName);
updateStatus();
hideModal();
};
reader.readAsText(file);
fallbackOpen.value = "";
});
// Save File Button
async function saveFile() {
const content = editor.getValue();
const defaultNames = {
"HTML": "index.html",
"CSS": "style.css",
"JavaScript": "script.js",
"C#": "Program.cs",
"C++": "main.cpp",
"C": "main.c",
"Plain Text": "untitled.txt"
};
const suggestedName = currentFileName !== "untitled"
? currentFileName
: (defaultNames[currentLang] || "untitled.txt");
if (window.showSaveFilePicker) {
try {
if (!fileHandle) {
fileHandle = await window.showSaveFilePicker({ suggestedName });
}
const writable = await fileHandle.createWritable();
await writable.write(content);
await writable.close();
currentFileName = fileHandle.name;
updateStatus();
} catch (err) {
if (err.name !== "AbortError") console.error(err);
}
} else {
const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
const url = URL.createObjectURL(blob);
const a = document.createElement("a");
a.href = url;
a.download = suggestedName;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
currentFileName = suggestedName;
updateStatus();
}
}



### Why Your Original Version Broke
* **Placeholder CDN Links:** Your pasted snippet showed `src="https://cloudflare.com"` instead of the full `.js` and `.css` paths from `cdnjs.cloudflare.com`. If any script tag fails to load `CodeMirror`, `CodeMirror.fromTextArea` throws a `ReferenceError` and stops the rest of the `<script>` from registering `openFile`, `saveFile`, and `showModal`.
* **Array Indexing in Snippet Lookup:** In `match = before.match(/(\S+)$/)`, `match` is an array where the matched word is `match[1]`. Accessing `languageSnippets[currentLang][match[1]]` ensures the snippet expands cleanly when you press `Tab`.
