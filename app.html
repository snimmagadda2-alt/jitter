<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JitterDev Editor</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- CodeMirror core -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css" />

  <!-- Assets are stamped per page load so an edit is never served from a stale cache. -->
  <script>
    (function () {
      var stamp = "?v=" + Date.now();
      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "app.css" + stamp;
      document.head.appendChild(css);
      window.__jitterStamp = stamp;
    })();
  </script>
</head>
<body>
  <!-- ============================ boot screen ============================ -->
  <div id="boot-screen" class="boot-screen" aria-hidden="true">
    <span class="boot-blob one"></span>
    <span class="boot-blob two"></span>
    <span class="boot-blob three"></span>
    <span class="boot-grid"></span>
    <div class="boot-core">
      <div class="boot-logo-wrap">
        <span class="boot-ring"></span>
        <span class="boot-ring second"></span>
        <img src="icon.png" alt="" class="boot-logo" />
      </div>
      <div class="boot-title">JitterDev</div>
      <div class="boot-tagline">Code Workspace</div>
      <div class="boot-progress"><span id="boot-fill" class="boot-progress-fill"></span></div>
      <div class="boot-meta">
        <span id="boot-status">Waking the engine</span>
        <span id="boot-percent">0%</span>
      </div>
    </div>
    <span class="boot-skip">Click anywhere to skip</span>
  </div>

  <!-- ============================= title bar ============================= -->
  <div class="titlebar">
    <div class="tb-left">
      <img src="icon.png" alt="" class="tb-logo" />
      <nav id="menubar" aria-label="Application menu"></nav>
    </div>
    <button class="command-center" id="command-center" title="Search files and run commands (Ctrl+Shift+P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
      <span id="command-center-text">jitter-workspace</span>
    </button>
    <div class="tb-right">
      <a class="tb-link" href="index.html" title="Back to the JitterDev home page">Get App</a>
      <span class="win-dots" aria-hidden="true"><i></i><i></i></span>
    </div>
  </div>

  <!-- ============================= workbench ============================= -->
  <div class="workbench">
    <nav class="activitybar" id="activitybar" aria-label="Activity bar">
      <button class="ab-btn active" data-view="explorer" title="Explorer (Ctrl+Shift+E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6l2 2h8v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" /><path d="M4 4v15" /></svg>
      </button>
      <button class="ab-btn" data-view="search" title="Search (Ctrl+Shift+F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" /></svg>
      </button>
      <button class="ab-btn" data-view="scm" title="Source Control (Ctrl+Shift+G)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="5" r="2.4" /><circle cx="6" cy="19" r="2.4" /><circle cx="18" cy="12" r="2.4" /><path d="M6 7.4v9.2M8.4 5h5.1a2 2 0 0 1 2 2v2.6" /></svg>
        <span class="ab-badge" id="scm-badge" hidden>0</span>
      </button>
      <button class="ab-btn" data-view="run" title="Run and Debug (Ctrl+Shift+D)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5v15l13-7.5z" /></svg>
      </button>
      <button class="ab-btn" data-view="extensions" title="Language Packs (Ctrl+Shift+X)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1" /><rect x="13" y="4" width="7" height="7" rx="1" /><rect x="4" y="13" width="7" height="7" rx="1" /><path d="M16.5 13v7M13 16.5h7" /></svg>
      </button>
      <span class="ab-spacer"></span>
      <button class="ab-btn" id="ab-account" title="About JitterDev">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4" /><path d="M5 20c0-3.4 3.1-5.6 7-5.6s7 2.2 7 5.6" /></svg>
      </button>
      <button class="ab-btn" id="ab-settings" title="Settings and shortcuts (Ctrl+K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7" /></svg>
      </button>
    </nav>

    <!-- ------------------------------ sidebar ------------------------------ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title" id="sidebar-title">Explorer</span>
        <div class="sidebar-actions" id="sidebar-actions"></div>
      </div>
      <div class="views">
        <div class="view active" id="view-explorer"></div>

        <div class="view" id="view-search">
          <div class="search-field">
            <input id="search-input" type="text" placeholder="Search workspace" spellcheck="false" />
            <button class="search-toggle" id="search-case" title="Match case">Aa</button>
            <button class="search-toggle" id="search-word" title="Match whole word">ab</button>
          </div>
          <div id="search-results"></div>
        </div>

        <div class="view" id="view-scm"></div>
        <div class="view" id="view-run"></div>
        <div class="view" id="view-extensions">
          <div class="search-field">
            <input id="ext-input" type="text" placeholder="Filter languages" spellcheck="false" />
          </div>
          <div class="side-note" id="ext-note"></div>
          <div id="ext-list"></div>
        </div>
      </div>
    </aside>

    <div class="resizer-x" id="sidebar-resizer" role="separator" aria-orientation="vertical" title="Resize sidebar"></div>

    <!-- ---------------------------- editor area ---------------------------- -->
    <main class="editor-area">
      <div class="tabs">
        <div class="tabs-scroll" id="tabs"></div>
        <div class="tabs-actions">
          <button class="icon-btn" id="btn-new-file" title="New file (Ctrl+N)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button class="icon-btn" id="btn-split" title="Toggle minimap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M15 4v16" /></svg>
          </button>
          <button class="icon-btn" id="btn-more" title="Command palette (Ctrl+Shift+P)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></svg>
          </button>
        </div>
      </div>

      <div class="breadcrumbs" id="breadcrumbs"></div>

      <div class="editor-region">
        <div id="editor-container"></div>
        <div class="minimap" id="minimap">
          <canvas id="minimap-canvas"></canvas>
          <div class="minimap-slider" id="minimap-slider"></div>
        </div>

        <div class="find-widget" id="find-widget">
          <div class="find-row">
            <input id="find-input" type="text" placeholder="Find" spellcheck="false" />
            <button class="find-toggle" id="find-case" title="Match case">Aa</button>
            <button class="find-toggle" id="find-word" title="Match whole word">ab</button>
            <button class="find-toggle" id="find-regex" title="Use regular expression">.*</button>
            <span class="find-count" id="find-count">No results</span>
            <button class="icon-btn" id="find-prev" title="Previous match (Shift+Enter)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 6-6 6 6" /></svg>
            </button>
            <button class="icon-btn" id="find-next" title="Next match (Enter)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 10 6 6 6-6" /></svg>
            </button>
            <button class="icon-btn" id="find-close" title="Close (Esc)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <div class="find-row hidden" id="replace-row">
            <input id="replace-input" type="text" placeholder="Replace" spellcheck="false" />
            <button class="btn" id="replace-one" title="Replace current match">Replace</button>
            <button class="btn" id="replace-all" title="Replace all matches">All</button>
          </div>
        </div>
      </div>

      <div class="resizer-y" id="panel-resizer" role="separator" aria-orientation="horizontal" title="Resize panel"></div>

      <section class="panel" id="panel">
        <div class="panel-head">
          <button class="panel-tab" data-panel="problems">Problems <span class="panel-count" id="problems-count"></span></button>
          <button class="panel-tab active" data-panel="output">Output</button>
          <button class="panel-tab" data-panel="terminal">Terminal</button>
          <div class="panel-actions">
            <button class="icon-btn" id="panel-clear" title="Clear">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" /></svg>
            </button>
            <button class="icon-btn" id="panel-close" title="Close panel (Ctrl+J)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
          </div>
        </div>
        <div class="panel-body" id="panel-problems"></div>
        <div class="panel-body" id="panel-output">
          <span class="panel-line dim">JitterDev output — run a file with Ctrl+Alt+R or from the Run view.</span>
        </div>
        <div class="panel-body hidden" id="panel-terminal">
          <div class="term-log" id="term-log"></div>
          <div class="term-input-row">
            <span class="term-prompt">jitter@workspace ~ %</span>
            <input class="term-input" id="term-input" type="text" spellcheck="false" autocomplete="off" aria-label="Terminal input" />
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ============================= status bar ============================ -->
  <footer class="statusbar" id="statusbar">
    <button class="sb-item" id="sb-branch" title="Source control branch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="2.2" /><circle cx="6" cy="18" r="2.2" /><circle cx="18" cy="12" r="2.2" /><path d="M6 8.2v7.6M8.2 6h5.3a2 2 0 0 1 2 2v1.8" /></svg>
      main
    </button>
    <button class="sb-item" id="sb-problems" title="Show problems">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 8v5M12 16.2v.2" /></svg>
      <span id="sb-problems-count">0</span>
    </button>
    <div class="sb-right">
      <button class="sb-item optional" id="sb-sync" title="Workspace is in sync"><span class="sb-dot"></span>Synced</button>
      <button class="sb-item" id="sb-cursor" title="Go to line">Ln 1, Col 1</button>
      <button class="sb-item optional" id="sb-indent" title="Select indentation">Spaces: 2</button>
      <button class="sb-item optional" id="sb-encoding" title="File encoding">UTF-8</button>
      <button class="sb-item optional" id="sb-eol" title="End of line sequence">LF</button>
      <button class="sb-item" id="sb-language" title="Change language mode">Plain Text</button>
      <span class="sb-credit" title="Created by Suryansh Nimmagadda">
        Created By Suryansh Nimmagadda
        <svg viewBox="0 0 24 24" fill="none" aria-label="Verified" role="img"><path fill="currentColor" d="M12 1.5c1.1 0 1.9 1.2 2.9 1.5 1 .3 2.4-.3 3.3.3.9.6.8 2.1 1.4 2.9.6.8 2.1 1.2 2.4 2.2.3 1-.6 2.2-.6 3.3s.9 2.3.6 3.3c-.3 1-1.8 1.4-2.4 2.2-.6.8-.5 2.3-1.4 2.9-.9.6-2.3 0-3.3.3-1 .3-1.8 1.5-2.9 1.5s-1.9-1.2-2.9-1.5c-1-.3-2.4.3-3.3-.3-.9-.6-.8-2.1-1.4-2.9-.6-.8-2.1-1.2-2.4-2.2-.3-1 .6-2.2.6-3.3s-.9-2.3-.6-3.3c.3-1 1.8-1.4 2.4-2.2.6-.8.5-2.3 1.4-2.9.9-.6 2.3 0 3.3-.3 1-.3 1.8-1.5 2.9-1.5Z" /><path d="m8 12 2.6 2.6L16.5 9" stroke="#2b1a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </span>
    </div>
  </footer>

  <!-- ============================== palette ============================= -->
  <div class="overlay" id="palette-overlay">
    <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <input class="palette-input" id="palette-input" type="text" spellcheck="false" autocomplete="off" placeholder="Type the name of a command to run" />
      <div class="palette-list" id="palette-list"></div>
    </div>
  </div>

  <!-- ============================== dialog ============================== -->
  <div class="overlay" id="dialog-overlay">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title">Dialog</h2>
        <button class="icon-btn" id="dialog-close" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="dialog-body" id="dialog-body"></div>
    </div>
  </div>

  <!-- ============================== preview ============================== -->
  <div class="overlay preview-overlay" id="preview-overlay">
    <div class="preview-frame" role="dialog" aria-modal="true" aria-label="Live preview">
      <div class="preview-head">
        <span class="file-pill" id="preview-name">index.html</span>
        <span id="preview-note">Live preview</span>
        <span class="spacer"></span>
        <button class="btn" id="preview-reload">Reload</button>
        <button class="btn primary" id="preview-close">Close</button>
      </div>
      <iframe id="preview-frame" title="Preview" sandbox="allow-scripts allow-forms allow-modals"></iframe>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

  <!-- CodeMirror core + preloaded grammars -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <!-- helpers that several language modes build on -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/overlay.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/multiplex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/meta.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>

  <!-- Editor behaviour addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchtags.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/indent-fold.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/comment-fold.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/loadmode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/display/placeholder.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emmetio/codemirror-plugin@1.2.4/dist/browser.min.js"></script>

  <script>
    (function () {
      var script = document.createElement("script");
      script.src = "app.js" + (window.__jitterStamp || "");
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
